<div class="auth-page">
  <div class="sparkles"></div>
  <div class="auth-card">

    <!-- Cột trái: Hình ảnh nghệ thuật -->
    <div class="img-col">
      <img src="/image/login_side_art.png" alt="Thư viện" class="cover-img" />
      <div class="img-overlay"></div>
      <div class="img-content">
        <div class="img-badge">📚 Sachweb.vn</div>
        <h2 class="img-quote">"Một cuốn sách thực sự tốt dạy cho tôi nhiều điều hơn là chỉ đọc nó."</h2>
        <p class="img-author">— Henry David Thoreau</p>
      </div>
    </div>

    <!-- Cột phải: Form đăng nhập -->
    <div class="form-col">
      <div class="form-inner">

        <!-- Logo -->
        <div class="text-center mb-4">
          <a routerLink="/" class="logo-link">
            <img src="/image/logosw.png" alt="Sách Web" height="52" class="logo" />
          </a>
          <h3 class="form-title">Chào Mừng Trở Lại</h3>
          <p class="form-subtitle">Đăng nhập để tiếp tục hành trình tri thức của bạn.</p>
        </div>

        <!-- Form -->
        <form (submit)="onSubmit()" #loginForm="ngForm" novalidate>

          <!-- Email -->
          <div class="field-group">
            <label for="email" class="field-label">Tài khoản hoặc Email</label>
            <div class="field-wrap">
              <i class="bi bi-person-fill field-icon"></i>
              <input type="text" id="email" name="email" class="field-input" placeholder="Nhập tài khoản hoặc email"
                [(ngModel)]="email" required />
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label for="password" class="field-label">Mật khẩu</label>
            <div class="field-wrap">
              <i class="bi bi-shield-lock-fill field-icon"></i>
              <input [type]="showPassword() ? 'text' : 'password'" id="password" name="password"
                class="field-input has-toggle" placeholder="••••••••" [(ngModel)]="password" required />
              <button type="button" class="toggle-pw" (click)="togglePasswordVisibility()" title="Hiện/Ẩn mật khẩu">
                <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
              </button>
            </div>
            <!-- Forgot Password Link -->
            <div class="text-end mt-2">
              <a routerLink="/forgot-password" class="gold-link small">Quên mật khẩu?</a>
            </div>
          </div>

          <!-- Error alert -->
          <div class="error-box" *ngIf="errorMessage()">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ errorMessage() }}</span>
          </div>

          <!-- Submit -->
          <button type="submit" class="submit-btn">
            <span>ĐĂNG NHẬP</span>
            <i class="bi bi-arrow-right-circle-fill"></i>
          </button>

          <!-- Register link -->
          <p class="switch-link">
            Chưa có tài khoản?
            <a routerLink="/register" class="gold-link">Đăng ký ngay</a>
          </p>

          <!-- Divider -->
          <div class="social-divider">
            <span>Hoặc đăng nhập bằng</span>
          </div>

          <!-- Google Login Button (Custom Premium Design) -->
          <button type="button" class="social-btn google-btn animate-social" (click)="loginWithGoogle()">
            <svg class="social-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4" />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853" />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                fill="#FBBC05" />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                fill="#EA4335" />
            </svg>
            <span>Tiếp tục với Google</span>
          </button>

        </form>
      </div>
    </div>

  </div>
</div>
