<div class="auth-page">
  <div class="auth-card">

    <!-- Cột trái: Hình ảnh nghệ thuật -->
    <div class="img-col">
      <img src="/image/register_side_art.png" alt="Thư viện" class="cover-img" />
      <div class="img-overlay"></div>
      <div class="img-content">
        <div class="img-badge">✨ Sachweb.vn</div>
        <h2 class="img-quote">"Việc đọc rất quan trọng. Nếu bạn biết cách đọc, cả thế giới sẽ mở ra cho bạn."</h2>
        <p class="img-author">— Barack Obama</p>
      </div>
    </div>

    <!-- Cột phải: Form đăng ký -->
    <div class="form-col">
      <div class="form-inner">

        <!-- Logo -->
        <div class="text-center mb-3">
          <a routerLink="/" class="logo-link">
            <img src="/image/logosw.png" alt="Sách Web" height="48" class="logo" />
          </a>
          <h3 class="form-title">Tạo Tài Khoản Mới</h3>
          <p class="form-subtitle">Gia nhập cộng đồng yêu sách Sachweb ngay hôm nay.</p>
        </div>

        <!-- Form -->
        <form (submit)="onSubmit()" #registerForm="ngForm" novalidate>

          <!-- Họ và tên -->
          <div class="field-group">
            <label for="name" class="field-label">Họ và tên</label>
            <div class="field-wrap">
              <i class="bi bi-person-fill field-icon"></i>
              <input type="text" id="name" name="name" class="field-input"
                placeholder="Nguyễn Văn A" [(ngModel)]="name" required />
            </div>
          </div>

          <!-- Email -->
          <div class="field-group">
            <label for="email" class="field-label">Địa chỉ Email</label>
            <div class="field-wrap">
              <i class="bi bi-envelope-fill field-icon"></i>
              <input type="email" id="email" name="email" class="field-input"
                placeholder="nhapmail@gmail.com" [(ngModel)]="email" required />
            </div>
          </div>

          <!-- Số điện thoại -->
          <div class="field-group">
            <label for="phone" class="field-label">Số điện thoại</label>
            <div class="field-wrap">
              <i class="bi bi-telephone-fill field-icon"></i>
              <input type="tel" id="phone" name="phone" class="field-input"
                placeholder="09XXXXXXXX" [(ngModel)]="phone" required />
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label for="password" class="field-label">Mật khẩu</label>
            <div class="field-wrap">
              <i class="bi bi-shield-lock-fill field-icon"></i>
              <input [type]="showPassword() ? 'text' : 'password'" id="password"
                name="password" class="field-input has-toggle"
                placeholder="Tối thiểu 6 ký tự" [(ngModel)]="password" required />
              <button type="button" class="toggle-pw"
                (click)="togglePasswordVisibility()" title="Hiện/Ẩn mật khẩu">
                <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="field-group">
            <label for="confirmPassword" class="field-label">Xác nhận mật khẩu</label>
            <div class="field-wrap">
              <i class="bi bi-shield-check field-icon"></i>
              <input [type]="showPassword() ? 'text' : 'password'" id="confirmPassword"
                name="confirmPassword" class="field-input"
                placeholder="Nhập lại mật khẩu" [(ngModel)]="confirmPassword" required />
            </div>
          </div>

          <!-- Error alert -->
          <div class="error-box" *ngIf="errorMessage()">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ errorMessage() }}</span>
          </div>

          <!-- Submit -->
          <button type="submit" class="submit-btn">
            <span>ĐĂNG KÝ NGAY</span>
            <i class="bi bi-arrow-right-circle-fill"></i>
          </button>

          <!-- Login link -->
          <p class="switch-link">
            Đã có tài khoản?
            <a routerLink="/login" class="gold-link">Đăng nhập ngay</a>
          </p>

        </form>
      </div>
    </div>

  </div>
</div>
